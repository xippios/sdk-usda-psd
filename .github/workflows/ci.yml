# The org ruleset requires a check named `ci` on main. The matrix job is `test`, the
# namespace sibling proof is `siblings`; the single `ci` job below aggregates both so the
# required check has one name.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  siblings:
    # ADR-0006: this wheel and xippios-usda-nass share xippios.usda in one environment.
    name: siblings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: scripts/check-siblings.sh

  ci:
    name: ci
    needs: [test, siblings]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the whole matrix and the sibling check to pass
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test.result }}"
            exit 1
          fi
          if [ "${{ needs.siblings.result }}" != "success" ]; then
            echo "siblings result: ${{ needs.siblings.result }}"
            exit 1
          fi
